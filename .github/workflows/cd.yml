name: CD

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npx expo export --platform web

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p /home/runner/.ssh
          printf '%s\n' "$SSH_KEY" > /home/runner/.ssh/deploy_key
          chmod 600 /home/runner/.ssh/deploy_key

          printf '%s\n' "$KNOWN_HOSTS" > /home/runner/.ssh/known_hosts
          chmod 600 /home/runner/.ssh/known_hosts

          mkdir -p /home/runner/.config/rclone

          {
            echo "[strato_cci]"
            echo "type = sftp"
            echo "host = $HOST"
            echo "user = $USER"
            echo "port = 22"
            echo "key_file = /home/runner/.ssh/deploy_key"
            echo "known_hosts_file = /home/runner/.ssh/known_hosts"
            echo "disable_hashcheck = true"
          } > /home/runner/.config/rclone/rclone.conf

          rclone -vv sync dist/ strato_cci:/cci-timer/
